<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rifa 100 Puestos - Miguel Samudio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --neon: #39ff14;
    --ink: #05100a;
    --panel: #0a1a12;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { color-scheme: dark; font-family: 'Rubik', sans-serif; background-color: var(--ink); color: #f4f4f5; }
  body { min-height: 100vh; display: flex; flex-direction: column; }

  header {
    position: sticky; top: 0; z-index: 30;
    border-bottom: 1px solid rgba(57, 255, 20, 0.4);
    background-color: rgba(5, 16, 10, 0.9);
    backdrop-filter: blur(8px);
  }
  .container { max-width: 768px; margin: 0 auto; padding: 1rem; }
  
  .header-flex { display: flex; flex-direction: column; align-items: center; justify-content: space-between; gap: 0.75rem; }
  @media(min-width: 640px) { .header-flex { flex-direction: row; } }

  h1 { font-size: 1.25rem; font-weight: bold; color: var(--neon); text-shadow: 0 0 14px rgba(57,255,20,0.7); }
  
  .status-online { background-color: rgba(57, 255, 20, 0.2); color: var(--neon); border-radius: 9999px; padding: 0.125rem 0.625rem; font-size: 0.75rem; font-weight: 500; }
  .status-error { background-color: rgba(239, 68, 68, 0.2); color: #f87171; border-radius: 9999px; padding: 0.125rem 0.625rem; font-size: 0.75rem; font-weight: 500; }

  .btn-export {
    display: flex; align-items: center; gap: 0.5rem; border-radius: 0.5rem;
    border: 1px solid rgba(57, 255, 20, 0.5); background-color: rgba(57, 255, 20, 0.1);
    padding: 0.375rem 1rem; font-size: 0.875rem; font-weight: 500; color: var(--neon); cursor: pointer; transition: background 0.2s;
  }
  .btn-export:hover { background-color: rgba(57, 255, 20, 0.2); }

  .stats-grid {
    margin-top: 1rem; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr));
    border-radius: 0.75rem; border: 1px solid rgba(57, 255, 20, 0.25); text-align: center;
  }
  @media(min-width: 640px) { .stats-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
  .stat-box { padding: 0.5rem 0; }
  .stat-box-border { border-left: 1px solid rgba(57, 255, 20, 0.25); }
  .stat-title { font-size: 0.75rem; color: #a1a1aa; display: flex; align-items: center; justify-content: center; gap: 0.35rem; }
  .stat-value { font-size: 1.25rem; font-weight: bold; font-variant-numeric: tabular-nums; }
  .stat-total { color: var(--neon); }

  main { max-width: 768px; width: 100%; margin: 0 auto; padding: 1.5rem 1rem; flex: 1; }

  .panel {
    border-radius: 1rem; border: 1px solid rgba(57, 255, 20, 0.3);
    background-color: var(--panel); padding: 1rem; box-shadow: 0 0 30px rgba(57,255,20,0.12);
  }
  @media(min-width: 640px) { .panel { padding: 1.5rem; } }

  .grid-numeros {
    display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 0.5rem;
  }
  @media(min-width: 640px) {
    .grid-numeros { grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 0.75rem; }
  }

  .ball {
    aspect-ratio: 1; width: 100%; border-radius: 9999px; font-size: 0.875rem; font-weight: bold;
    font-variant-numeric: tabular-nums; display: flex; align-items: center; justify-content: center;
    cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; border: none; outline: none; position: relative;
  }
  @media(min-width: 640px) { .ball { font-size: 1rem; } }
  .ball:hover { transform: scale(1.1); box-shadow: 0 0 14px rgba(57,255,20,0.8); z-index: 10; }

  /* Estados de las bolas */
  .ball-disponible { background-color: #ffffff; color: #000000; }
  .ball-pendiente  { background-color: #facc15; color: #000000; }
  .ball-pagado     { background-color: #166534; color: rgba(255,255,255,0.7); border: 1px solid rgba(34,197,94,0.6); position: relative; overflow: hidden; }
  .ball-pagado::before, .ball-pagado::after {
    content: ""; position: absolute; left: 50%; top: 50%; width: 66%; height: 3px;
    border-radius: 2px; background: #fff; transform: translate(-50%, -50%) rotate(45deg);
  }
  .ball-pagado::after { transform: translate(-50%, -50%) rotate(-45deg); }

  .hint { margin-top: 1rem; margin-bottom: 2rem; text-align: center; font-size: 0.875rem; color: #71717a; }

  /* Listado de números */
  .list-container { display: flex; flex-direction: column; gap: 0.5rem; max-height: 24rem; overflow-y: auto; padding-right: 0.5rem; }
  .list-item { display: flex; align-items: center; justify-content: space-between; border-radius: 0.5rem; background-color: rgba(39, 39, 42, 0.5); padding: 0.5rem 1rem; font-size: 0.875rem; }
  .list-badge { border-radius: 0.25rem; padding: 0.25rem 0.5rem; font-size: 0.75rem; font-weight: 600; }
  .badge-disp { background-color: #3f3f46; color: #d4d4d8; }
  .badge-pend { background-color: #eab308; color: #000; }
  .badge-pag  { background-color: #16a34a; color: #fff; }

  /* Modal */
  dialog { width: 92vw; max-width: 380px; border-radius: 1rem; background: transparent; border: none; padding: 0; margin: auto; }
  dialog::backdrop { background: rgba(0,0,0,0.85); backdrop-filter: blur(4px); }
  .modal-box { border-radius: 1rem; border: 1px solid rgba(57, 255, 20, 0.5); background-color: var(--panel); padding: 1.25rem; box-shadow: 0 0 30px rgba(57,255,20,0.25); }
  
  .form-group { margin-bottom: 0.75rem; }
  .form-group label { display: block; font-size: 0.875rem; color: #d4d4d8; margin-bottom: 0.25rem; }
  .form-control { width: 100%; border-radius: 0.5rem; border: 1px solid rgba(57,255,20,0.3); background-color: var(--ink); padding: 0.5rem 0.75rem; color: #f4f4f5; outline: none; }
  .form-control:focus { ring: 2px solid var(--neon); border-color: var(--neon); }

  .btn-wa { display: flex; width: 100%; align-items: center; justify-content: center; gap: 0.5rem; border-radius: 0.5rem; background-color: #22c55e; padding: 0.625rem; font-weight: bold; color: #fff; border: none; cursor: pointer; margin-top: 1rem; }
  .btn-wa:hover { background-color: #16a34a; }

  .modal-actions { margin-top: 1.5rem; display: flex; gap: 0.5rem; }
  .btn-liberar { width: 33%; border-radius: 0.5rem; border: 1px solid rgba(239, 68, 68, 0.5); background-color: rgba(239, 68, 68, 0.1); padding: 0.625rem; font-size: 0.875rem; font-weight: 500; color: #ef4444; cursor: pointer; }
  .btn-cancel  { width: 33%; border-radius: 0.5rem; border: 1px solid #52525b; background: transparent; padding: 0.625rem; font-size: 0.875rem; font-weight: 500; color: #f4f4f5; cursor: pointer; }
  .btn-save    { width: 33%; border-radius: 0.5rem; background-color: var(--neon); padding: 0.625rem; font-size: 0.875rem; font-weight: bold; color: #000; border: none; cursor: pointer; }
</style>
</head>

<body>

<!-- Dashboard fijo -->
<header>
  <div class="container">
    <div class="header-flex">
      <div style="display: flex; align-items: center; gap: 0.5rem;">
        <h1>Rifa de 100 puestos</h1>
        <span id="syncStatus" class="status-online">Conectando...</span>
      </div>
      <button id="btnExport" class="btn-export">
        <svg style="width: 1rem; height: 1rem;" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
        Exportar CSV
      </button>
    </div>
    
    <div class="stats-grid">
      <div class="stat-box">
        <p class="stat-title"><span style="width: 8px; height: 8px; border-radius: 50%; background: #fff; display: inline-block;"></span>Disponibles</p>
        <p id="cDisp" class="stat-value">100</p>
      </div>
      <div class="stat-box stat-box-border">
        <p class="stat-title"><span style="width: 8px; height: 8px; border-radius: 50%; background: #eab308; display: inline-block;"></span>Pendientes</p>
        <p id="cPend" class="stat-value">0</p>
      </div>
      <div class="stat-box stat-box-border">
        <p class="stat-title"><span style="width: 8px; height: 8px; border-radius: 50%; background: #16a34a; display: inline-block;"></span>Pagados</p>
        <p id="cPaid" class="stat-value">0</p>
      </div>
      <div class="stat-box stat-box-border" style="grid-column: span 3; @media(min-width:640px){grid-column:span 1;}">
        <p class="stat-title" style="color: #a1a1aa;">Recaudado</p>
        <p id="cTotal" class="stat-value stat-total">$ 0</p>
      </div>
    </div>
  </div>
</header>

<main>
  <!-- Grilla -->
  <div class="panel">
    <div id="grid" class="grid-numeros"></div>
  </div>
  
  <p id="hint" class="hint"></p>

  <!-- Lista de números -->
  <div class="panel">
    <h2 style="margin-bottom: 1rem; font-size: 1.125rem; font-weight: bold; color: #fff;">Listado de Números</h2>
    <div id="listaNumeros" class="list-container"></div>
  </div>
</main>

<!-- Modal de edición -->
<dialog id="modal">
  <form id="form" class="modal-box">
    <div style="margin-bottom: 1.25rem; display: flex; align-items: center; gap: 1rem;">
      <div id="mBall" style="width: 4rem; height: 4rem; border-radius: 50%; display: grid; place-items: center; font-size: 1.5rem; font-weight: bold; position: relative;"></div>
      <h2 style="font-size: 1.125rem; font-weight: bold;">Gestionar número</h2>
    </div>

    <div class="form-group">
      <label>Estado</label>
      <select id="estado" class="form-control">
        <option value="disponible">Disponible</option>
        <option value="pendiente">Pendiente</option>
        <option value="pagado">Pagado</option>
      </select>
    </div>

    <div class="form-group">
      <label>Nombre del comprador</label>
      <input id="nombre" type="text" maxlength="60" autocomplete="off" placeholder="Nombre y apellido" class="form-control">
    </div>

    <div class="form-group">
      <label>Teléfono</label>
      <input id="telefono" type="tel" inputmode="tel" maxlength="20" autocomplete="off" placeholder="3000000000" class="form-control">
    </div>

    <button type="button" id="btnWa" class="btn-wa">
      <svg style="width: 1.25rem; height: 1.25rem;" fill="currentColor" viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51a12.8 12.8 0 00-.57-.01c-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
      Enviar WhatsApp
    </button>

    <div class="modal-actions">
      <button type="button" id="btnLiberar" class="btn-liberar">Liberar</button>
      <button type="button" id="cancel" class="btn-cancel">Cancelar</button>
      <button type="submit" class="btn-save">Guardar</button>
    </div>
  </form>
</dialog>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getDatabase, ref, set, remove, onValue } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyD8Fw4lkHc9Yn0PWx3WuMj-Cp-u8n-fmYc",
    authDomain: "rifa-100-puestos-fcfe2.firebaseapp.com",
    databaseURL: "https://rifa-100-puestos-fcfe2-default-rtdb.firebaseio.com",
    projectId: "rifa-100-puestos-fcfe2",
    storageBucket: "rifa-100-puestos-fcfe2.firebasestorage.app",
    messagingSenderId: "772223550404",
    appId: "1:772223550404:web:62a3a05cec605ee9435a91"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  const rifaRef = ref(db, 'rifa_100_puestos');

  const PRECIO = 20000;
  const fmt = new Intl.NumberFormat('es-CO', { style: 'currency', currency: 'COP', maximumFractionDigits: 0 });

  const ESTADOS = {
    disponible: { label: 'Disponible', cls: 'ball-disponible', listCls: 'badge-disp' },
    pendiente:  { label: 'Pendiente',  cls: 'ball-pendiente',  listCls: 'badge-pend' },
    pagado:     { label: 'Pagado',     cls: 'ball-pagado',     listCls: 'badge-pag' }
  };

  const $ = id => document.getElementById(id);
  const pad = n => String(n).padStart(2, '0');

  let data = {};

  onValue(rifaRef, (snapshot) => {
    data = snapshot.val() || {};
    const status = $('syncStatus');
    status.textContent = 'En línea';
    status.className = 'status-online';
    render();
  }, (error) => {
    const status = $('syncStatus');
    status.textContent = 'Error de conexión';
    status.className = 'status-error';
    console.error(error);
  });

  const getNum = k => {
    const r = data[k];
    return r && ESTADOS[r.estado] ? r : { estado: 'disponible', nombre: '', telefono: '' };
  };

  function render() {
    const grid = $('grid');
    const listaNumeros = $('listaNumeros');
    
    grid.replaceChildren();
    listaNumeros.replaceChildren();
    
    const count = { disponible: 0, pendiente: 0, pagado: 0 };

    for (let i = 0; i < 100; i++) {
      const k = pad(i), r = getNum(k), est = ESTADOS[r.estado];
      count[r.estado]++;

      const b = document.createElement('button');
      b.type = 'button';
      b.textContent = k;
      b.className = `ball ${est.cls}`;
      b.title = r.nombre ? `${r.nombre} ${r.telefono ? ' - ' + r.telefono : ''}` : est.label;
      b.addEventListener('click', () => openModal(k));
      grid.append(b);

      const item = document.createElement('div');
      item.className = 'list-item';
      
      item.innerHTML = `
        <div style="display: flex; align-items: center; gap: 0.75rem;">
          <span style="display: inline-flex; width: 2rem; height: 2rem; align-items: center; justify-content: center; border-radius: 50%; background-color: #000; font-weight: bold; color: #fff; box-shadow: inset 0 2px 4px rgba(255,255,255,0.1);">${k}</span>
          <span style="font-weight: 500; color: #e4e4e7;">${r.nombre || '<span style="color: #71717a; font-style: italic;">Libre</span>'}</span>
        </div>
        <span class="list-badge ${est.listCls}">${est.label}</span>
      `;
      listaNumeros.append(item);
    }

    $('cDisp').textContent = count.disponible;
    $('cPend').textContent = count.pendiente;
    $('cPaid').textContent = count.pagado;
    $('cTotal').textContent = fmt.format(count.pagado * PRECIO);
  }

  let current = null;

  function paintPreview() {
    const b = $('mBall');
    const est = ESTADOS[$('estado').value];
    b.className = `ball ${est.cls}`;
    b.textContent = current;
  }

  function openModal(k) {
    current = k;
    const r = getNum(k);
    $('estado').value = r.estado;
    $('nombre').value = r.nombre;
    $('telefono').value = r.telefono;
    paintPreview();
    $('modal').showModal();
  }

  $('estado').addEventListener('change', paintPreview);
  $('cancel').addEventListener('click', () => $('modal').close());
  $('modal').addEventListener('click', e => { if (e.target === $('modal')) $('modal').close(); });

  $('form').addEventListener('submit', async e => {
    e.preventDefault();
    const numRef = ref(db, `rifa_100_puestos/${current}`);
    await set(numRef, {
      estado: $('estado').value,
      nombre: $('nombre').value.trim(),
      telefono: $('telefono').value.trim()
    });
    $('modal').close();
  });

  $('btnLiberar').addEventListener('click', async e => {
    e.preventDefault();
    if (confirm(`¿Estás seguro de liberar el puesto ${current}? Se borrarán los datos del comprador.`)) {
      const numRef = ref(db, `rifa_100_puestos/${current}`);
      await remove(numRef);
      $('modal').close();
    }
  });

  $('btnWa').addEventListener('click', () => {
    let tel = $('telefono').value.replace(/\D/g, ''); 
    let nom = $('nombre').value.trim() || 'Hola';
    let est = $('estado').value;
    
    if (tel.length < 10) {
      alert('Por favor ingresa un número de teléfono válido (al menos 10 dígitos) para enviar el WhatsApp.');
      return;
    }
    if (!tel.startsWith('57') && tel.length === 10) tel = '57' + tel;

    let mensaje = `Hola ${nom}, te escribo por la Rifa. Tu número es el *${current}*. `;
    if (est === 'pendiente') {
      mensaje += `Recuerda que está pendiente de pago por valor de ${fmt.format(PRECIO)}. ¡Gracias por el apoyo!`;
    } else if (est === 'pagado') {
      mensaje += `Te confirmo que ya registré tu pago. ¡Mucha suerte en el sorteo!`;
    } else {
      mensaje += `El número te lo separé temporalmente. Quedo atento.`;
    }

    const url = `https://wa.me/${tel}?text=${encodeURIComponent(mensaje)}`;
    window.open(url, '_blank');
  });

  $('btnExport').addEventListener('click', () => {
    let csv = "Numero;Estado;Nombre;Telefono\n";
    let hayDatos = false;
    for (let i = 0; i < 100; i++) {
      let k = pad(i);
      if (data[k]) {
        hayDatos = true;
        csv += `${k};${data[k].estado};${data[k].nombre || ''};${data[k].telefono || ''}\n`;
      }
    }
    if (!hayDatos) {
      alert('No hay números vendidos o pendientes para exportar aún.');
      return;
    }
    const blob = new Blob(["\uFEFF" + csv], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    link.setAttribute("href", url);
    link.setAttribute("download", "Rifa_100_Puestos.csv");
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
  });

  $('hint').textContent = `Toca un número para editarlo. Cada puesto vale ${fmt.format(PRECIO)} COP.`;
  render();
</script>
</body>
</html>
